[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trader-agent"
version = "1.2.0"
description = "BIST Günlük Trading Karar-Destek Agent'ı"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pandas>=2.2",
    "ta>=0.11",
    "rich>=13",
    "prompt_toolkit>=3",
    "pyyaml>=6",
    "python-telegram-bot>=21",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
trader-agent = "trader_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trader_agent.config" = ["market_default.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: canlı API gerektiren testler"]
