services:
  engine:
    build: .
    image: trader-agent:local
    command: ["trader-agent", "engine"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENGINE_API_KEY: ${ENGINE_API_KEY:?ENGINE_API_KEY zorunlu}
      ENGINE_HOST: 0.0.0.0
      ENGINE_PORT: ${ENGINE_PORT:?ENGINE_PORT zorunlu}
      ENGINE_URL: http://engine:${ENGINE_PORT:?ENGINE_PORT zorunlu}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:${ENGINE_PORT:?ENGINE_PORT zorunlu}:${ENGINE_PORT:?ENGINE_PORT zorunlu}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os
          import urllib.request
          urllib.request.urlopen(f"http://127.0.0.1:{os.environ['ENGINE_PORT']}/health", timeout=5)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  userui:
    build: ./userui
    environment:
      ENGINE_URL: http://engine:${ENGINE_PORT:?ENGINE_PORT zorunlu}
      ENGINE_API_KEY: ${ENGINE_API_KEY:?ENGINE_API_KEY zorunlu}
      USERUI_DATABASE_PATH: /app/data/web.db
      USERUI_ORIGIN: ${USERUI_ORIGIN:-}
      USERUI_HOST: 0.0.0.0
      USERUI_PORT: ${USERUI_PORT:?USERUI_PORT zorunlu}
    ports:
      - "127.0.0.1:${USERUI_PORT:?USERUI_PORT zorunlu}:${USERUI_PORT:?USERUI_PORT zorunlu}"
    volumes:
      - web-data:/app/data
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.USERUI_PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  web-data:
